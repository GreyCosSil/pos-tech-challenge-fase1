[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-tech-challenge-fase1"
version = "0.1.0"
description = "Pipeline Preditivo de Churn com Modelagem Clássica e API REST"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core & Machine Learning
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    # O modelo persistido em models/ foi treinado com esta versão.
    "scikit-learn==1.4.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
    
    # API & Serve
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "python-json-logger>=2.0.7",
    "PyJWT>=2.8.0",
    
    # Observabilidade
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
    "jupyterlab>=4.1.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.2",
    "kagglehub>=1.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: testes isolados de funções ou módulos, com dependências simuladas",
    "integration: testes da aplicação integrada por meio de requisições HTTP",
]