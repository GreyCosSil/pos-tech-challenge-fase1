name: Pipeline (CI/CD)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ETAPA DE CI: Testa o código antes de qualquer junção
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4
        
      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Instala bibliotecas
        run: |
          pip install -r requirements.txt
          
      - name: Roda os Testes (pytest)
        run: |
          pytest tests/

